databases:
  - name: labcompetence-db
    databaseName: labcompetence
    user: labcompetence_user
    plan: basic-256mb

services:
  - type: web
    name: labcompetence-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter backend build
    startCommand: pnpm --filter backend start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: labcompetence-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: disabled
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "1025"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ENABLE_PRIVATE_SEED
        value: "false"
      - key: PRIVATE_SEED_FILE
        value: /etc/secrets/private-seed.json

  - type: web
    name: labcompetence-frontend
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter frontend build
    staticPublishPath: apps/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
